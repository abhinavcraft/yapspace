name: YapSpace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_ENABLE_DEMO: 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-password
          POSTGRES_DB: yapspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npm run test:db:postgres
        env:
          YAPSPACE_TEST_DATABASE_URL: postgresql://postgres:local-ci-test-password@localhost:5432/yapspace_test
      - run: npm audit --audit-level=moderate
      - run: npm run build
